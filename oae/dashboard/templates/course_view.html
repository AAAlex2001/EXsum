<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Курсы</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        }

        .number-card {
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            border: none;
        }

        .number-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.2);
        }

        .number-value {
            font-size: 3rem;
            font-weight: 600;
        }

        .copied {
            background: rgba(25,135,84,0.5) !important;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center text-white">

<div class="container text-center">
    <div class="row g-4 justify-content-center">

        <div class="col-md-4 d-flex">
            <div class="card number-card p-4 w-100 d-flex flex-column justify-content-center " onclick="copyText(this)">
                <div class="text-white-50 mb-2" style="font-size:1.2rem;">Курс базовый</div>
                <div class="number-value">{{ course_base|floatformat:3 }}</div>
                <div class="mt-2 text-white-50">
                    <i class="bi bi-clipboard"></i>
                </div>
            </div>
        </div>

        <div class="col-md-4 d-flex">
        <div class="card number-card p-4 w-100 d-flex flex-column justify-content-center"
             onclick="copyText(this)">
            <div class="text-white-50 mb-2" style="font-size:1.2rem;">Курс на Таджикистан</div>
            <div class="number-value">{{ course_tadg|floatformat:3 }}</div>
            <div class="mt-2 text-white-50">
                <i class="bi bi-clipboard"></i>
            </div>
        </div>
        </div>

        <div class="col-md-4 d-flex">
        <div class="card number-card p-4 w-100 d-flex flex-column justify-content-center"
             onclick="copyText(this)">
            <div class="text-white-50 mb-2" style="font-size:1.2rem;">Курс доставки</div>
            <div class="number-value">{{ course_delivery|floatformat:3 }}</div>
            <div class="mt-2 text-white-50">
                <i class="bi bi-clipboard"></i>
            </div>
        </div>
        </div>






</div>

    </div>


<script>
    function copyText(card) {
        const value = card.querySelector('.number-value').innerText;
        navigator.clipboard.writeText(value).then(() => {
            card.classList.add('copied');
            setTimeout(() => card.classList.remove('copied'), 800);
        });
    }
</script>

</body>
</html>
