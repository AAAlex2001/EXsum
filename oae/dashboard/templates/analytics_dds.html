{% extends "unfold/layouts/base.html" %}

{% block content %}


{% if rows %}
  <div class="overflow-x-auto border border-gray-300 rounded-lg shadow-sm max-w-3xl mb-8">
    <table class="min-w-full border border-gray-300 text-sm">
      <thead class="bg-gray-50">
        <tr class="border-b border-gray-300">
          {% for col in columns %}
            <th scope="col"
                class="px-4 py-2 text-left font-medium uppercase tracking-wide text-gray-600 border-r border-gray-300 last:border-r-0">
              {{ col }}
            </th>
          {% endfor %}
        </tr>
      </thead>
      <tbody class="bg-white">
        {% for row in rows %}
          <tr class="border-b border-gray-200 hover:bg-gray-50">
            {% for cell in row %}
              <td class="px-4 py-2 whitespace-nowrap text-gray-700 border-r border-gray-200 last:border-r-0">
                {{ cell }}
              </td>
            {% endfor %}
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% else %}
  <p class="text-center text-gray-500 italic">Ничего не выбрано.</p>
{% endif %}
{% endblock %}
